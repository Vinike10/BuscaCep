name: BuscaCep CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Validate HTML and Structure
      run: |
        echo "Validating project assets..."
        test -f index.html
        test -f css/styles.css
        test -f js/app.js
        test -f js/resilienceEngine.js
        test -f js/cacheManager.js
        test -f js/validator.js
        echo "BuscaCep structure is 100% valid!"
